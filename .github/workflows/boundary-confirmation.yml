        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p25-input-${{ github.run_attempt }}-anti-panic
          path: target/p25-evidence
          if-no-files-found: error

  nats-integration:
    name: NATS JetStream integration
    needs: qualification-sha
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        id: campaign_01
        if: always()
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify checked out SHA
        id: confirmation_sha
        if: always()
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned Rust toolchain
        id: campaign_02
        if: always()
        continue-on-error: true
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # commit dell'action (2026-09-03), non la versione di Rust: quella è in toolchain:
        with:
          toolchain: '1.98.1'

      - name: Restore Cargo cache
        id: campaign_03
        if: always()
        continue-on-error: true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Start ephemeral NATS JetStream
        if: always()
        continue-on-error: true
        id: nats
        shell: pwsh
        run: |
          $status = ./scripts/nats-docker.ps1 Start | ConvertFrom-Json
          "run_id=$($status.run_id)" >> $env:GITHUB_OUTPUT
          "client_url=$($status.client_url)" >> $env:GITHUB_OUTPUT

