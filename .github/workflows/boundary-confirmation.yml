          python -m pip install --no-index --find-links target/chain-wheels plenora_runtime==0.1.0

      - name: Install chain qualification binary
        continue-on-error: true
        if: always()
        id: confirmation_17
        run: cargo install --path crates/plenora-runtime-chain-cli --root target/chain-install --debug --locked

      - name: Verify installed scripted surfaces and async heartbeat
        continue-on-error: true
        if: always()
        id: confirmation_18
        env:
          PLENORA_CHAIN_BIN: ${{ github.workspace }}/target/chain-install/bin/plenora-runtime${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m unittest discover -s crates/plenora-runtime-chain-python/tests -p 'test_*.py'

      - name: Build documentation
        continue-on-error: true
        if: always()
        id: confirmation_19
