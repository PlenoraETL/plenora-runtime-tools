  anti-panic:
    name: clippy anti-panic (librerie)
    needs: qualification-sha
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        continue-on-error: true
        if: always()
        id: confirmation_01
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify checked out SHA
        id: confirmation_sha
        if: always()
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned Rust toolchain
        continue-on-error: true
        if: always()
        id: confirmation_02
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # commit dell'action (2026-09-03), non la versione di Rust: quella è in toolchain:
        with:
          toolchain: '1.98.1'
          components: clippy

      - name: Restore Cargo cache
        continue-on-error: true
        if: always()
        id: confirmation_03
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run anti-panic Clippy on libraries
        continue-on-error: true
        if: always()
        id: confirmation_04
        run: >-
          cargo clippy --workspace --lib --all-features --locked --
          -D warnings
          -D clippy::unwrap_used
          -D clippy::expect_used
          -D clippy::panic
          -D clippy::unreachable

      - name: Persist original step outcomes
        if: always()
        env:
          CAMPAIGN_STEPS: ${{ toJson(steps) }}
        run: python scripts/boundary_confirmation.py collect --job anti-panic

      - name: Upload campaign evidence even on failure
