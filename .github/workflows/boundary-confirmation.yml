        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: python scripts/run_confirmation_tests.py --label campaign_05 -- cargo test --no-fail-fast -p plenora-runtime-nats --test real_nats --locked -- --ignored --nocapture

