        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: python scripts/run_confirmation_tests.py --label campaign_06 -- cargo test --no-fail-fast -p plenora-runtime-integration-tests --test nats_worker_dlq --locked -- --ignored --nocapture

      - name: Run complete capability worker and crash recovery integration test
        id: campaign_07
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: python scripts/run_confirmation_tests.py --label campaign_07 -- cargo test --no-fail-fast -p plenora-runtime-integration-tests --test nats_capability_e2e --locked -- --ignored --nocapture

      - name: Run product negotiation and settlement over real NATS
        id: campaign_08
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
          CARGO_BUILD_JOBS: 2
        run: python scripts/run_confirmation_tests.py --label campaign_08 -- cargo test --no-fail-fast -p plenora-runtime-integration-tests --test chain_delivery --locked nats_real_product -- --ignored --nocapture

      - name: Collect NATS logs on failure
        id: campaign_09
        continue-on-error: true
        if: always() && steps.nats.outputs.run_id != ''
        shell: pwsh
        run: ./scripts/nats-docker.ps1 Logs -RunId '${{ steps.nats.outputs.run_id }}' -LogTail 200

      - name: Remove ephemeral NATS container
        id: campaign_10
        continue-on-error: true
        if: always() && steps.nats.outputs.run_id != ''
        shell: pwsh
        run: ./scripts/nats-docker.ps1 Cleanup -RunId '${{ steps.nats.outputs.run_id }}'

      - name: Aggregate every campaign outcome
        if: always()
        env:
          CAMPAIGN_STEPS: ${{ toJson(steps) }}
        run: python scripts/ci_campaign.py campaign_01 campaign_02 campaign_03 nats campaign_05 campaign_06 campaign_07 campaign_08 campaign_10

      - name: Persist original step outcomes
        if: always()
        env:
          CAMPAIGN_STEPS: ${{ toJson(steps) }}
        run: python scripts/boundary_confirmation.py collect --job nats-integration

      - name: Upload campaign evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p25-input-${{ github.run_attempt }}-nats-integration
          path: target/p25-evidence
          if-no-files-found: error

  postgres-integration:
    name: PostgreSQL durable chain store
    needs: qualification-sha
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      PLENORA_STORAGE_DIAGNOSTICS: 1
      POSTGRES_CONTAINER: plenora-chain-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        id: campaign_01
        if: always()
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify checked out SHA
        id: confirmation_sha
        if: always()
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned Rust toolchain
        id: campaign_02
        if: always()
        continue-on-error: true
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # toolchain below
        with:
          toolchain: '1.98.1'
      - name: Restore Cargo cache
        id: campaign_03
        if: always()
        continue-on-error: true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Start ephemeral PostgreSQL with durable local commits
        id: campaign_04
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          docker build -t plenora-postgres-adapter-ci - < scripts/postgres-adapter-ci.Dockerfile
          docker run -d --name "$POSTGRES_CONTAINER" \
            -e POSTGRES_PASSWORD=ephemeral-ci-only -e POSTGRES_DB=chain_store \
            -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 \
            -p 127.0.0.1::5432 \
            plenora-postgres-adapter-ci
          # The initdb server accepts socket connections before the final TCP server starts.
          # Authenticate against the actual database; pg_isready alone does not check credentials.
          for attempt in $(seq 1 60); do
            if docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" \
              psql -h 127.0.0.1 -U postgres -d chain_store -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" \
            psql -h 127.0.0.1 -U postgres -d chain_store -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null
          port=$(docker port "$POSTGRES_CONTAINER" 5432/tcp | cut -d: -f2)
          echo "PLENORA_POSTGRES_URL=host=127.0.0.1 port=$port user=postgres password=ephemeral-ci-only dbname=chain_store" >> "$GITHUB_ENV"
      - name: Validate all migrations on empty upgraded and already migrated databases
        id: campaign_05
        if: always()
        continue-on-error: true
        run: python scripts/run_confirmation_tests.py --label campaign_05 -- cargo test --no-fail-fast -p plenora-runtime-chain-store --locked postgres_migrations -- --ignored --nocapture --test-threads=1
      - name: Run real race crash restart retention and authority tests
        id: campaign_06
        if: always()
        continue-on-error: true
        run: python scripts/run_confirmation_tests.py --label campaign_06 -- cargo test --no-fail-fast -p plenora-runtime-chain-store --locked postgres_real -- --ignored --nocapture --test-threads=1
      - name: Install native scripted surfaces against the real primary
        id: campaign_07
        if: always()
        continue-on-error: true
        run: |
          python -m pip install maturin==1.15.0
          maturin build --manifest-path crates/plenora-runtime-chain-python/Cargo.toml --locked --out target/chain-wheels
          python -m pip install --no-index --find-links target/chain-wheels plenora_runtime==0.1.0
      - name: Install scripted binary independently of wheel installation
        id: campaign_08
        if: always()
        continue-on-error: true
        run: cargo install --path crates/plenora-runtime-chain-cli --root target/chain-install --debug --locked
      - name: Create isolated database for installed surfaces
        id: campaign_09
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # Store retention tests deliberately shrink their policy permanently; use a separate database.
          docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" \
            psql -h 127.0.0.1 -U postgres -d chain_store -v ON_ERROR_STOP=1 -c 'CREATE DATABASE chain_surfaces'
          docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" \
            psql -h 127.0.0.1 -U postgres -d chain_surfaces -v ON_ERROR_STOP=1 -c "CREATE EXTENSION postgis; CREATE TABLE s3_source (value text); CREATE TABLE s3_target (value text); INSERT INTO s3_source VALUES (NULL), (''), ('hello');"
          cargo run -p plenora-runtime-adapter-database --example database_fixture --locked > target/s3-database-fixture.json
          cargo run -p plenora-runtime-adapter-io --example io_fixture --locked -- "$RUNNER_TEMP/s3-io-fixture" > target/s3-io-fixture.json
      - name: Verify installed cancel resume and event cursors on isolated PostgreSQL
        id: campaign_10
        if: always()
        continue-on-error: true
        env:
          PLENORA_CHAIN_BIN: ${{ github.workspace }}/target/chain-install/bin/plenora-runtime
          PLENORA_DATABASE_FIXTURE: ${{ github.workspace }}/target/s3-database-fixture.json
          PLENORA_IO_FIXTURE: ${{ github.workspace }}/target/s3-io-fixture.json
        shell: bash
        run: |
          PLENORA_POSTGRES_URL="${PLENORA_POSTGRES_URL/dbname=chain_store/dbname=chain_surfaces}" \
            python -m unittest discover -s crates/plenora-runtime-chain-python/tests -p 'test_*.py'
      - name: Start ephemeral NATS for combined product qualification
        if: always()
        continue-on-error: true
        id: product_nats
        shell: pwsh
        run: |
          $status = ./scripts/nats-docker.ps1 Start | ConvertFrom-Json
          "run_id=$($status.run_id)" >> $env:GITHUB_OUTPUT
          "client_url=$($status.client_url)" >> $env:GITHUB_OUTPUT
      - name: Verify real observation timeout and late reply
        id: campaign_transport
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.product_nats.outputs.client_url }}
        run: python scripts/run_confirmation_tests.py --label campaign_transport -- cargo test --no-fail-fast -p plenora-runtime-chain-host --test transport --locked -- --ignored --nocapture --test-threads=1

      - name: Run scripted facade over real NATS
        id: campaign_12
        if: always()
        continue-on-error: true
        env:
          PLENORA_CHAIN_BIN: ${{ github.workspace }}/target/chain-install/bin/plenora-runtime
          PLENORA_DATABASE_FIXTURE: ${{ github.workspace }}/target/s3-database-fixture.json
          PLENORA_IO_FIXTURE: ${{ github.workspace }}/target/s3-io-fixture.json
          PLENORA_NATS_URL: ${{ steps.product_nats.outputs.client_url }}
        shell: bash
        run: |
          PLENORA_POSTGRES_URL="${PLENORA_POSTGRES_URL/dbname=chain_store/dbname=chain_surfaces}" \
            python scripts/run_confirmation_tests.py --label campaign_12 -- cargo test --no-fail-fast -p plenora-runtime-chain-host --test remote --test worker --test controls --test database --test io --locked -- --ignored --nocapture
      - name: Verify installed journal report pages after real fault injection
        id: campaign_13
        if: always()
        continue-on-error: true
        env:
          PLENORA_CHAIN_BIN: ${{ github.workspace }}/target/chain-install/bin/plenora-runtime
          PLENORA_DATABASE_FIXTURE: ${{ github.workspace }}/target/s3-database-fixture.json
          PLENORA_IO_FIXTURE: ${{ github.workspace }}/target/s3-io-fixture.json
          PLENORA_JOURNAL_REPORT: ${{ github.workspace }}/target/p14c1-journal-real.json
        run: python -m unittest discover -s crates/plenora-runtime-chain-python/tests -p 'test_journal_report.py'
      - name: Run product PostgreSQL and NATS settlement tests
        id: campaign_14
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.product_nats.outputs.client_url }}
        run: python scripts/run_confirmation_tests.py --label campaign_14 -- cargo test --no-fail-fast -p plenora-runtime-integration-tests --test chain_delivery --locked postgres_real_product -- --ignored --nocapture --test-threads=1
      - name: Remove combined qualification NATS container
        id: campaign_15
        continue-on-error: true
        if: always() && steps.product_nats.outputs.run_id != ''
        shell: pwsh
        run: ./scripts/nats-docker.ps1 Cleanup -RunId '${{ steps.product_nats.outputs.run_id }}'

      - name: Remove ephemeral PostgreSQL and its volume
        id: campaign_16
        continue-on-error: true
        if: always()
        run: docker rm -fv "$POSTGRES_CONTAINER"

      - name: Aggregate every campaign outcome
        if: always()
        env:
          CAMPAIGN_STEPS: ${{ toJson(steps) }}
        run: python scripts/ci_campaign.py campaign_transport campaign_01 campaign_02 campaign_03 campaign_04 campaign_05 campaign_06 campaign_07 campaign_08 campaign_09 campaign_10 product_nats campaign_12 campaign_13 campaign_14 campaign_15 campaign_16

      - name: Persist original step outcomes
        if: always()
        env:
          CAMPAIGN_STEPS: ${{ toJson(steps) }}
        run: python scripts/boundary_confirmation.py collect --job postgres-integration

      - name: Upload campaign evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p25-input-${{ github.run_attempt }}-postgres-integration
          path: target/p25-evidence
          if-no-files-found: error

  coverage:
    name: Line coverage (minimum 90%)
    needs: qualification-sha
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      PLENORA_STORAGE_DIAGNOSTICS: 1
      POSTGRES_CONTAINER: plenora-chain-coverage-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        id: campaign_01
        if: always()
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify checked out SHA
        id: confirmation_sha
        if: always()
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned Rust toolchain
        id: campaign_02
        if: always()
        continue-on-error: true
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # commit dell'action (2026-09-03), non la versione di Rust: quella è in toolchain:
        with:
          toolchain: '1.98.1'
          components: llvm-tools-preview

      - name: Restore Cargo cache
        id: campaign_03
        if: always()
        continue-on-error: true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pinned coverage tool
        id: campaign_04
        if: always()
        continue-on-error: true
        run: cargo install --locked cargo-llvm-cov --version 0.8.7

      - name: Start ephemeral NATS JetStream
        if: always()
        continue-on-error: true
        id: nats
        shell: pwsh
        run: |
          $status = ./scripts/nats-docker.ps1 Start | ConvertFrom-Json
          "run_id=$($status.run_id)" >> $env:GITHUB_OUTPUT
          "client_url=$($status.client_url)" >> $env:GITHUB_OUTPUT

      - name: Start ephemeral PostgreSQL with durable local commits
        id: campaign_06
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          docker build -t plenora-postgres-adapter-ci - < scripts/postgres-adapter-ci.Dockerfile
          docker run -d --name "$POSTGRES_CONTAINER" \
            -e POSTGRES_PASSWORD=ephemeral-ci-only -e POSTGRES_DB=chain_store \
            -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 \
            -p 127.0.0.1::5432 \
            plenora-postgres-adapter-ci
          # The initdb server accepts socket connections before the final TCP server starts.
          # Authenticate against the actual database; pg_isready alone does not check credentials.
          for attempt in $(seq 1 60); do
            if docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" \
              psql -h 127.0.0.1 -U postgres -d chain_store -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" \
            psql -h 127.0.0.1 -U postgres -d chain_store -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null
          port=$(docker port "$POSTGRES_CONTAINER" 5432/tcp | cut -d: -f2)
          echo "PLENORA_POSTGRES_URL=host=127.0.0.1 port=$port user=postgres password=ephemeral-ci-only dbname=chain_store" >> "$GITHUB_ENV"
      - name: Clean previous coverage profiles
        id: campaign_clean
        if: always()
        continue-on-error: true
        run: cargo llvm-cov clean --workspace
      - name: Collect normal workspace coverage
        id: campaign_07
        if: always()
        continue-on-error: true
        run: |
          python scripts/run_confirmation_tests.py --label campaign_07 -- cargo llvm-cov --no-fail-fast --workspace \
            --exclude plenora-example-worker-basic \
            --exclude plenora-example-worker-nats \
            --exclude plenora-example-http-worker \
            --exclude plenora-example-http-service \
            --exclude plenora-runtime-example-scheduler-basic \
            --exclude plenora-runtime-example-benchmark \
            --exclude plenora-runtime-architecture-tests \
            --exclude plenora-runtime-integration-tests \
            --exclude plenora-runtime-memory-tests \
            --locked --no-report

      - name: Collect real NATS adapter coverage
        id: campaign_08
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: python scripts/run_confirmation_tests.py --label campaign_08 -- cargo llvm-cov --no-fail-fast -p plenora-runtime-nats --test real_nats --locked --no-report -- --ignored --nocapture

      - name: Collect NATS to Apalis integration coverage
        id: campaign_09
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: python scripts/run_confirmation_tests.py --label campaign_09 -- cargo llvm-cov --no-fail-fast -p plenora-runtime-integration-tests --test nats_worker_dlq --locked --no-report -- --ignored --nocapture

      - name: Collect capability worker and crash recovery coverage
        id: campaign_10
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: python scripts/run_confirmation_tests.py --label campaign_10 -- cargo llvm-cov --no-fail-fast -p plenora-runtime-integration-tests --test nats_capability_e2e --locked --no-report -- --ignored --nocapture

      - name: Validate and collect all migration paths
        id: campaign_11
        if: always()
        continue-on-error: true
        run: python scripts/run_confirmation_tests.py --label campaign_11 -- cargo llvm-cov --no-fail-fast -p plenora-runtime-chain-store --locked --no-report -- postgres_migrations --ignored --nocapture --test-threads=1

      - name: Collect real PostgreSQL store coverage
        id: campaign_12
        if: always()
        continue-on-error: true
        run: python scripts/run_confirmation_tests.py --label campaign_12 -- cargo llvm-cov --no-fail-fast -p plenora-runtime-chain-store --locked --no-report -- postgres_real --ignored --nocapture --test-threads=1

      - name: Collect product state machine and combined transport coverage
        id: campaign_13
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: |
          python scripts/run_confirmation_tests.py --label campaign_13 -- cargo llvm-cov --no-fail-fast -p plenora-runtime-integration-tests --test chain_delivery --locked --no-report
      - name: Collect combined real product transport coverage independently
        id: campaign_14
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: python scripts/run_confirmation_tests.py --label campaign_14 -- cargo llvm-cov --no-fail-fast -p plenora-runtime-integration-tests --test chain_delivery --locked --no-report -- --ignored --test-threads=1

      - name: Create host coverage database with default retention
        id: campaign_host_db
        if: always()
        continue-on-error: true
        run: |
          docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE chain_host'
          docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" psql -h 127.0.0.1 -U postgres -d chain_host -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION postgis'
          cargo run -p plenora-runtime-adapter-io --example io_fixture --locked -- "$RUNNER_TEMP/s3-io-coverage" > target/s3-io-coverage.json

      - name: Collect real scripted host request reply coverage
        id: campaign_host
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: |
          PLENORA_POSTGRES_URL="${PLENORA_POSTGRES_URL/dbname=chain_store/dbname=chain_host}" \
            python scripts/run_confirmation_tests.py --label campaign_host -- cargo llvm-cov --no-fail-fast -p plenora-runtime-chain-host --test remote --locked --no-report -- nats_real_scripted --ignored --nocapture --test-threads=1

      - name: Collect real autonomous host worker coverage
        id: campaign_host_worker
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: |
          PLENORA_POSTGRES_URL="${PLENORA_POSTGRES_URL/dbname=chain_store/dbname=chain_host}" \
            python scripts/run_confirmation_tests.py --label campaign_host_worker -- cargo llvm-cov --no-fail-fast -p plenora-runtime-chain-host --test worker --locked --no-report -- postgres_nats_real --ignored --nocapture --test-threads=1

      - name: Collect real observation timeout and late reply coverage
        id: campaign_host_transport
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: python scripts/run_confirmation_tests.py --label campaign_host_transport -- cargo llvm-cov --no-fail-fast -p plenora-runtime-chain-host --test transport --locked --no-report -- --ignored --nocapture --test-threads=1

      - name: Collect real database adapter host coverage
        id: campaign_adapter_database
        if: always()
        continue-on-error: true
        env:
          PLENORA_IO_FIXTURE: ${{ github.workspace }}/target/s3-io-coverage.json
        run: |
          PLENORA_POSTGRES_URL="${PLENORA_POSTGRES_URL/dbname=chain_store/dbname=chain_host}" \
            python scripts/run_confirmation_tests.py --label campaign_adapter_database -- cargo llvm-cov --no-fail-fast -p plenora-runtime-chain-host --test database --locked --no-report -- --ignored --nocapture --test-threads=1

      - name: Collect real io adapter host coverage
        id: campaign_adapter_io
        if: always()
        continue-on-error: true
        env:
          PLENORA_IO_FIXTURE: ${{ github.workspace }}/target/s3-io-coverage.json
        run: |
          PLENORA_POSTGRES_URL="${PLENORA_POSTGRES_URL/dbname=chain_store/dbname=chain_host}" \
            python scripts/run_confirmation_tests.py --label campaign_adapter_io -- cargo llvm-cov --no-fail-fast -p plenora-runtime-chain-host --test io --locked --no-report -- --ignored --nocapture --test-threads=1

      - name: Enforce line coverage threshold
        id: campaign_15
        if: always()
        continue-on-error: true
        run: cargo llvm-cov report --summary-only --fail-under-lines 90

      - name: Collect NATS logs on failure
        id: campaign_16
        continue-on-error: true
        if: always() && steps.nats.outputs.run_id != ''
        shell: pwsh
        run: ./scripts/nats-docker.ps1 Logs -RunId '${{ steps.nats.outputs.run_id }}' -LogTail 200

      - name: Remove ephemeral NATS container
        id: campaign_17
        continue-on-error: true
        if: always() && steps.nats.outputs.run_id != ''
        shell: pwsh
        run: ./scripts/nats-docker.ps1 Cleanup -RunId '${{ steps.nats.outputs.run_id }}'

      - name: Remove ephemeral PostgreSQL and its volume
        id: campaign_18
        continue-on-error: true
        if: always()
        run: docker rm -fv "$POSTGRES_CONTAINER"

      - name: Aggregate every campaign outcome
        if: always()
        env:
          CAMPAIGN_STEPS: ${{ toJson(steps) }}
        run: python scripts/ci_campaign.py campaign_clean campaign_01 campaign_02 campaign_03 campaign_04 nats campaign_06 campaign_07 campaign_08 campaign_09 campaign_10 campaign_11 campaign_12 campaign_13 campaign_14 campaign_host_db campaign_host campaign_host_worker campaign_host_transport campaign_adapter_database campaign_adapter_io campaign_15 campaign_17 campaign_18

      - name: Export complete coverage data
        id: confirmation_coverage_export
        if: always()
        continue-on-error: true
        run: cargo llvm-cov report --json --output-path target/p25-evidence/coverage.json

      - name: Persist original step outcomes
        if: always()
        env:
          CAMPAIGN_STEPS: ${{ toJson(steps) }}
        run: python scripts/boundary_confirmation.py collect --job coverage

      - name: Upload campaign evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p25-input-${{ github.run_attempt }}-coverage
          path: target/p25-evidence
          if-no-files-found: error

  report:
    name: Enumerate executed D proofs and publish one report
    if: always()
    needs: [qualification-sha, quality-linux, quality-windows, anti-panic, nats-integration, postgres-integration, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download all evidence from this run attempt
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --pattern "p25-input-$GITHUB_RUN_ATTEMPT-*" --dir target/p25-evidence
      - name: Require all executed cells and original job outcomes
        if: always()
        env:
          CONFIRMATION_NEEDS: ${{ toJson(needs) }}
        run: python scripts/boundary_confirmation.py report
      - name: Publish unified report and complete evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: boundary-confirmation-${{ github.sha }}-${{ github.run_attempt }}
          path: target/p25-evidence
          if-no-files-found: error
