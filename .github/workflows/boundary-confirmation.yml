        run: python scripts/boundary_confirmation.py collect --job quality-windows

      - name: Upload campaign evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p25-input-${{ github.run_attempt }}-quality-windows
