# Generated by scripts/generate_boundary_confirmation.py from ci.yml.
name: Boundary integrated confirmation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA to confirm
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CARGO_BUILD_JOBS: 2
  PLENORA_CONFIRMATION_DIR: ${{ github.workspace }}/target/p25-evidence
jobs:
  qualification-sha:
    name: Verify qualification SHA
    runs-on: ubuntu-latest
    steps:
      - name: Verify explicitly requested commit
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

  quality-linux:
    name: Quality (ubuntu-latest)
    needs: qualification-sha
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        continue-on-error: true
        if: always()
        id: confirmation_01
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify checked out SHA
        id: confirmation_sha
        if: always()
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned Rust toolchain
        continue-on-error: true
        if: always()
        id: confirmation_02
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # commit dell'action (2026-09-03), non la versione di Rust: quella è in toolchain:
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy

      - name: Restore Cargo cache
        continue-on-error: true
        if: always()
        id: confirmation_03
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        continue-on-error: true
        if: always()
        id: confirmation_04
        run: cargo fmt --all --check

      - name: Check offline contract adoption and registries
        continue-on-error: true
        if: always()
        id: confirmation_05
        run: python scripts/check-contract-adoption.py

      - name: Test Python quality gates
        continue-on-error: true
        if: always()
        id: confirmation_06
        run: python -m pip install -r scripts/requirements-chains.txt

      - name: Test Python gates and chain contract fixtures
        continue-on-error: true
        if: always()
        id: confirmation_07
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check comment quality
        continue-on-error: true
        if: always()
        id: confirmation_08
        run: python scripts/check_comments.py

      - name: Check documentation quality
        continue-on-error: true
        if: always()
        id: confirmation_09
        run: python scripts/check_docs.py

      - name: Check workspace
        continue-on-error: true
        if: always()
        id: confirmation_10
        run: cargo check --workspace --all-targets --locked

      - name: Check chain feature inventory
        continue-on-error: true
        if: always()
        id: confirmation_11
        run: python scripts/check_chain_inventory.py

      - name: Check chain dependency boundaries
        continue-on-error: true
        if: always()
        id: confirmation_12
        run: |
          cargo fetch --locked
          python scripts/check_chain_graph.py

      - name: Run Clippy
        continue-on-error: true
        if: always()
        id: confirmation_13
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        continue-on-error: true
        if: always()
        id: confirmation_14
        run: python scripts/run_confirmation_tests.py

      - name: Install pinned native wheel builder
        continue-on-error: true
        if: always()
        id: confirmation_15
        run: python -m pip install maturin==1.15.0

      - name: Build and install native wheel
        continue-on-error: true
        if: always()
        id: confirmation_16
        run: |
          maturin build --manifest-path crates/plenora-runtime-chain-python/Cargo.toml --locked --out target/chain-wheels
          python -m pip install --no-index --find-links target/chain-wheels plenora_runtime==0.1.0

      - name: Install chain qualification binary
        continue-on-error: true
        if: always()
        id: confirmation_17
        run: cargo install --path crates/plenora-runtime-chain-cli --root target/chain-install --debug --locked

      - name: Verify installed scripted surfaces and async heartbeat
        continue-on-error: true
        if: always()
        id: confirmation_18
        env:
          PLENORA_CHAIN_BIN: ${{ github.workspace }}/target/chain-install/bin/plenora-runtime${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m unittest discover -s crates/plenora-runtime-chain-python/tests -p 'test_*.py'

      - name: Build documentation
        continue-on-error: true
        if: always()
        id: confirmation_19
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  # Gate anti-panic: il codice di libreria non scrive primitive di panico.
  # `--lib` lascia fuori test, binari ed esempi, dove un `expect` è
  # un'asserzione e non un difetto. Un'eccezione è un `#[allow]` puntuale con
  # `reason`, accanto al codice che la giustifica.
      - name: Persist original step outcomes
        if: always()
        env:
          CAMPAIGN_STEPS: ${{ toJson(steps) }}
        run: python scripts/boundary_confirmation.py collect --job quality-linux

      - name: Upload campaign evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p25-input-${{ github.run_attempt }}-quality-linux
          path: target/p25-evidence
          if-no-files-found: error

