      - name: Check chain feature inventory
        continue-on-error: true
        if: always()
        id: confirmation_11
        run: python scripts/check_chain_inventory.py

      - name: Check chain dependency boundaries
        continue-on-error: true
        if: always()
        id: confirmation_12
        run: |
          cargo fetch --locked
          python scripts/check_chain_graph.py

      - name: Run Clippy
        continue-on-error: true
        if: always()
        id: confirmation_13
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        continue-on-error: true
        if: always()
        id: confirmation_14
        run: python scripts/run_confirmation_tests.py

      - name: Install pinned native wheel builder
        continue-on-error: true
