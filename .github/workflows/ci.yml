name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification-sha:
    name: Verify qualification SHA
    runs-on: ubuntu-latest
    steps:
      - name: Verify explicitly requested commit
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$EXPECTED_SHA" = "$ACTUAL_SHA"

  quality:
    name: Quality (${{ matrix.os }})
    needs: qualification-sha
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # commit dell'action (2026-09-03), non la versione di Rust: quella è in toolchain:
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check offline contract adoption and registries
        run: python scripts/check-contract-adoption.py

      - name: Test Python quality gates
        run: python -m pip install -r scripts/requirements-chains.txt

      - name: Test Python gates and chain contract fixtures
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check comment quality
        run: python scripts/check_comments.py

      - name: Check documentation quality
        run: python scripts/check_docs.py

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Check chain feature inventory
        run: python scripts/check_chain_inventory.py

      - name: Check chain dependency boundaries
        run: |
          cargo fetch --locked
          python scripts/check_chain_graph.py

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Install pinned native wheel builder
        run: python -m pip install maturin==1.15.0

      - name: Build and install native wheel
        run: |
          maturin build --manifest-path crates/plenora-runtime-chain-python/Cargo.toml --locked --out target/chain-wheels
          python -m pip install --no-index --find-links target/chain-wheels plenora_runtime==0.1.0

      - name: Install chain qualification binary
        run: cargo install --path crates/plenora-runtime-chain-cli --root target/chain-install --debug --locked

      - name: Verify installed scripted surfaces and async heartbeat
        env:
          PLENORA_CHAIN_BIN: ${{ github.workspace }}/target/chain-install/bin/plenora-runtime${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m unittest discover -s crates/plenora-runtime-chain-python/tests -p 'test_*.py'

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  # Gate anti-panic: il codice di libreria non scrive primitive di panico.
  # `--lib` lascia fuori test, binari ed esempi, dove un `expect` è
  # un'asserzione e non un difetto. Un'eccezione è un `#[allow]` puntuale con
  # `reason`, accanto al codice che la giustifica.
  anti-panic:
    name: clippy anti-panic (librerie)
    needs: qualification-sha
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # commit dell'action (2026-09-03), non la versione di Rust: quella è in toolchain:
        with:
          toolchain: '1.98.1'
          components: clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run anti-panic Clippy on libraries
        run: >-
          cargo clippy --workspace --lib --all-features --locked --
          -D warnings
          -D clippy::unwrap_used
          -D clippy::expect_used
          -D clippy::panic
          -D clippy::unreachable

  dependency-policy:
    name: Dependency policy
    needs: qualification-sha
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # commit dell'action (2026-09-03), non la versione di Rust: quella è in toolchain:
        with:
          toolchain: '1.98.1'

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Audit dependencies
        run: cargo audit

      # `fuzz/` ha workspace e lock separati: senza un controllo dedicato il
      # suo grafo potrebbe divergere restando invisibile.
      - name: Audit fuzz dependencies
        run: cargo audit --file fuzz/Cargo.lock

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Check dependency policy
        run: cargo deny check

      - name: Check fuzz dependency policy
        run: cargo deny --manifest-path fuzz/Cargo.toml check

  nats-integration:
    name: NATS JetStream integration
    needs: qualification-sha
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        id: campaign_01
        if: always()
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        id: campaign_02
        if: always()
        continue-on-error: true
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # commit dell'action (2026-09-03), non la versione di Rust: quella è in toolchain:
        with:
          toolchain: '1.98.1'

      - name: Restore Cargo cache
        id: campaign_03
        if: always()
        continue-on-error: true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Start ephemeral NATS JetStream
        if: always()
        continue-on-error: true
        id: nats
        shell: pwsh
        run: |
          $status = ./scripts/nats-docker.ps1 Start | ConvertFrom-Json
          "run_id=$($status.run_id)" >> $env:GITHUB_OUTPUT
          "client_url=$($status.client_url)" >> $env:GITHUB_OUTPUT

      - name: Run real NATS adapter test
        id: campaign_05
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: cargo test --no-fail-fast -p plenora-runtime-nats --test real_nats --locked -- --ignored --nocapture

      - name: Run NATS to Apalis DLQ integration test
        id: campaign_06
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: cargo test --no-fail-fast -p plenora-runtime-integration-tests --test nats_worker_dlq --locked -- --ignored --nocapture

      - name: Run complete capability worker and crash recovery integration test
        id: campaign_07
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: cargo test --no-fail-fast -p plenora-runtime-integration-tests --test nats_capability_e2e --locked -- --ignored --nocapture

      - name: Run product negotiation and settlement over real NATS
        id: campaign_08
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
          CARGO_BUILD_JOBS: 2
        run: cargo test --no-fail-fast -p plenora-runtime-integration-tests --test chain_delivery --locked nats_real_product -- --ignored --nocapture

      - name: Collect NATS logs on failure
        id: campaign_09
        continue-on-error: true
        if: always() && steps.nats.outputs.run_id != ''
        shell: pwsh
        run: ./scripts/nats-docker.ps1 Logs -RunId '${{ steps.nats.outputs.run_id }}' -LogTail 200

      - name: Remove ephemeral NATS container
        id: campaign_10
        continue-on-error: true
        if: always() && steps.nats.outputs.run_id != ''
        shell: pwsh
        run: ./scripts/nats-docker.ps1 Cleanup -RunId '${{ steps.nats.outputs.run_id }}'

      - name: Aggregate every campaign outcome
        if: always()
        env:
          CAMPAIGN_STEPS: ${{ toJson(steps) }}
        run: python scripts/ci_campaign.py campaign_01 campaign_02 campaign_03 nats campaign_05 campaign_06 campaign_07 campaign_08 campaign_10

  postgres-integration:
    name: PostgreSQL durable chain store
    needs: qualification-sha
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      PLENORA_STORAGE_DIAGNOSTICS: 1
      POSTGRES_CONTAINER: plenora-chain-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        id: campaign_01
        if: always()
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        id: campaign_02
        if: always()
        continue-on-error: true
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # toolchain below
        with:
          toolchain: '1.98.1'
      - name: Restore Cargo cache
        id: campaign_03
        if: always()
        continue-on-error: true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Start ephemeral PostgreSQL with durable local commits
        id: campaign_04
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          docker run -d --name "$POSTGRES_CONTAINER" \
            -e POSTGRES_PASSWORD=ephemeral-ci-only -e POSTGRES_DB=chain_store \
            -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 \
            -p 127.0.0.1::5432 \
            postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
          # The initdb server accepts socket connections before the final TCP server starts.
          # Authenticate against the actual database; pg_isready alone does not check credentials.
          for attempt in $(seq 1 60); do
            if docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" \
              psql -h 127.0.0.1 -U postgres -d chain_store -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" \
            psql -h 127.0.0.1 -U postgres -d chain_store -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null
          port=$(docker port "$POSTGRES_CONTAINER" 5432/tcp | cut -d: -f2)
          echo "PLENORA_POSTGRES_URL=host=127.0.0.1 port=$port user=postgres password=ephemeral-ci-only dbname=chain_store" >> "$GITHUB_ENV"
      - name: Validate all migrations on empty upgraded and already migrated databases
        id: campaign_05
        if: always()
        continue-on-error: true
        run: cargo test --no-fail-fast -p plenora-runtime-chain-store --locked postgres_migrations -- --ignored --nocapture --test-threads=1
      - name: Run real race crash restart retention and authority tests
        id: campaign_06
        if: always()
        continue-on-error: true
        run: cargo test --no-fail-fast -p plenora-runtime-chain-store --locked postgres_real -- --ignored --nocapture --test-threads=1
      - name: Install native scripted surfaces against the real primary
        id: campaign_07
        if: always()
        continue-on-error: true
        run: |
          python -m pip install maturin==1.15.0
          maturin build --manifest-path crates/plenora-runtime-chain-python/Cargo.toml --locked --out target/chain-wheels
          python -m pip install --no-index --find-links target/chain-wheels plenora_runtime==0.1.0
      - name: Install scripted binary independently of wheel installation
        id: campaign_08
        if: always()
        continue-on-error: true
        run: cargo install --path crates/plenora-runtime-chain-cli --root target/chain-install --debug --locked
      - name: Create isolated database for installed surfaces
        id: campaign_09
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # Store retention tests deliberately shrink their policy permanently; use a separate database.
          docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" \
            psql -h 127.0.0.1 -U postgres -d chain_store -v ON_ERROR_STOP=1 -c 'CREATE DATABASE chain_surfaces'
      - name: Verify installed cancel resume and event cursors on isolated PostgreSQL
        id: campaign_10
        if: always()
        continue-on-error: true
        env:
          PLENORA_CHAIN_BIN: ${{ github.workspace }}/target/chain-install/bin/plenora-runtime
        shell: bash
        run: |
          PLENORA_POSTGRES_URL="${PLENORA_POSTGRES_URL/dbname=chain_store/dbname=chain_surfaces}" \
            python -m unittest discover -s crates/plenora-runtime-chain-python/tests -p 'test_*.py'
      - name: Start ephemeral NATS for combined product qualification
        if: always()
        continue-on-error: true
        id: product_nats
        shell: pwsh
        run: |
          $status = ./scripts/nats-docker.ps1 Start | ConvertFrom-Json
          "run_id=$($status.run_id)" >> $env:GITHUB_OUTPUT
          "client_url=$($status.client_url)" >> $env:GITHUB_OUTPUT
      - name: Run scripted facade over real NATS
        id: campaign_12
        if: always()
        continue-on-error: true
        env:
          PLENORA_CHAIN_BIN: ${{ github.workspace }}/target/chain-install/bin/plenora-runtime
          PLENORA_NATS_URL: ${{ steps.product_nats.outputs.client_url }}
        shell: bash
        run: |
          PLENORA_POSTGRES_URL="${PLENORA_POSTGRES_URL/dbname=chain_store/dbname=chain_surfaces}" \
            cargo test --no-fail-fast -p plenora-runtime-chain-host --test remote --test worker --test controls --locked -- --ignored --nocapture
      - name: Verify installed journal report pages after real fault injection
        id: campaign_13
        if: always()
        continue-on-error: true
        env:
          PLENORA_CHAIN_BIN: ${{ github.workspace }}/target/chain-install/bin/plenora-runtime
          PLENORA_JOURNAL_REPORT: ${{ github.workspace }}/target/p14c1-journal-real.json
        run: python -m unittest discover -s crates/plenora-runtime-chain-python/tests -p 'test_journal_report.py'
      - name: Run product PostgreSQL and NATS settlement tests
        id: campaign_14
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.product_nats.outputs.client_url }}
        run: cargo test --no-fail-fast -p plenora-runtime-integration-tests --test chain_delivery --locked postgres_real_product -- --ignored --nocapture --test-threads=1
      - name: Remove combined qualification NATS container
        id: campaign_15
        continue-on-error: true
        if: always() && steps.product_nats.outputs.run_id != ''
        shell: pwsh
        run: ./scripts/nats-docker.ps1 Cleanup -RunId '${{ steps.product_nats.outputs.run_id }}'

      - name: Remove ephemeral PostgreSQL and its volume
        id: campaign_16
        continue-on-error: true
        if: always()
        run: docker rm -fv "$POSTGRES_CONTAINER"

      - name: Aggregate every campaign outcome
        if: always()
        env:
          CAMPAIGN_STEPS: ${{ toJson(steps) }}
        run: python scripts/ci_campaign.py campaign_01 campaign_02 campaign_03 campaign_04 campaign_05 campaign_06 campaign_07 campaign_08 campaign_09 campaign_10 product_nats campaign_12 campaign_13 campaign_14 campaign_15 campaign_16

  coverage:
    name: Line coverage (minimum 90%)
    needs: qualification-sha
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      PLENORA_STORAGE_DIAGNOSTICS: 1
      POSTGRES_CONTAINER: plenora-chain-coverage-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        id: campaign_01
        if: always()
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        id: campaign_02
        if: always()
        continue-on-error: true
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # commit dell'action (2026-09-03), non la versione di Rust: quella è in toolchain:
        with:
          toolchain: '1.98.1'
          components: llvm-tools-preview

      - name: Restore Cargo cache
        id: campaign_03
        if: always()
        continue-on-error: true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pinned coverage tool
        id: campaign_04
        if: always()
        continue-on-error: true
        run: cargo install --locked cargo-llvm-cov --version 0.8.7

      - name: Start ephemeral NATS JetStream
        if: always()
        continue-on-error: true
        id: nats
        shell: pwsh
        run: |
          $status = ./scripts/nats-docker.ps1 Start | ConvertFrom-Json
          "run_id=$($status.run_id)" >> $env:GITHUB_OUTPUT
          "client_url=$($status.client_url)" >> $env:GITHUB_OUTPUT

      - name: Start ephemeral PostgreSQL with durable local commits
        id: campaign_06
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          docker run -d --name "$POSTGRES_CONTAINER" \
            -e POSTGRES_PASSWORD=ephemeral-ci-only -e POSTGRES_DB=chain_store \
            -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 \
            -p 127.0.0.1::5432 \
            postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
          # The initdb server accepts socket connections before the final TCP server starts.
          # Authenticate against the actual database; pg_isready alone does not check credentials.
          for attempt in $(seq 1 60); do
            if docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" \
              psql -h 127.0.0.1 -U postgres -d chain_store -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=ephemeral-ci-only "$POSTGRES_CONTAINER" \
            psql -h 127.0.0.1 -U postgres -d chain_store -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null
          port=$(docker port "$POSTGRES_CONTAINER" 5432/tcp | cut -d: -f2)
          echo "PLENORA_POSTGRES_URL=host=127.0.0.1 port=$port user=postgres password=ephemeral-ci-only dbname=chain_store" >> "$GITHUB_ENV"
      - name: Clean previous coverage profiles
        id: campaign_clean
        if: always()
        continue-on-error: true
        run: cargo llvm-cov clean --workspace
      - name: Collect normal workspace coverage
        id: campaign_07
        if: always()
        continue-on-error: true
        run: |
          cargo llvm-cov --no-fail-fast --workspace \
            --exclude plenora-example-worker-basic \
            --exclude plenora-example-worker-nats \
            --exclude plenora-example-http-worker \
            --exclude plenora-example-http-service \
            --exclude plenora-runtime-example-scheduler-basic \
            --exclude plenora-runtime-example-benchmark \
            --exclude plenora-runtime-architecture-tests \
            --exclude plenora-runtime-integration-tests \
            --exclude plenora-runtime-memory-tests \
            --locked --no-report

      - name: Collect real NATS adapter coverage
        id: campaign_08
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: cargo llvm-cov --no-fail-fast -p plenora-runtime-nats --test real_nats --locked --no-report -- --ignored --nocapture

      - name: Collect NATS to Apalis integration coverage
        id: campaign_09
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: cargo llvm-cov --no-fail-fast -p plenora-runtime-integration-tests --test nats_worker_dlq --locked --no-report -- --ignored --nocapture

      - name: Collect capability worker and crash recovery coverage
        id: campaign_10
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: cargo llvm-cov --no-fail-fast -p plenora-runtime-integration-tests --test nats_capability_e2e --locked --no-report -- --ignored --nocapture

      - name: Validate and collect all migration paths
        id: campaign_11
        if: always()
        continue-on-error: true
        run: cargo llvm-cov --no-fail-fast -p plenora-runtime-chain-store --locked --no-report -- postgres_migrations --ignored --nocapture --test-threads=1

      - name: Collect real PostgreSQL store coverage
        id: campaign_12
        if: always()
        continue-on-error: true
        run: cargo llvm-cov --no-fail-fast -p plenora-runtime-chain-store --locked --no-report -- postgres_real --ignored --nocapture --test-threads=1

      - name: Collect product state machine and combined transport coverage
        id: campaign_13
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: |
          cargo llvm-cov --no-fail-fast -p plenora-runtime-integration-tests --test chain_delivery --locked --no-report
      - name: Collect combined real product transport coverage independently
        id: campaign_14
        if: always()
        continue-on-error: true
        env:
          PLENORA_NATS_URL: ${{ steps.nats.outputs.client_url }}
        run: cargo llvm-cov --no-fail-fast -p plenora-runtime-integration-tests --test chain_delivery --locked --no-report -- --ignored --test-threads=1

      - name: Enforce line coverage threshold
        id: campaign_15
        if: always()
        continue-on-error: true
        run: cargo llvm-cov report --summary-only --fail-under-lines 90

      - name: Collect NATS logs on failure
        id: campaign_16
        continue-on-error: true
        if: always() && steps.nats.outputs.run_id != ''
        shell: pwsh
        run: ./scripts/nats-docker.ps1 Logs -RunId '${{ steps.nats.outputs.run_id }}' -LogTail 200

      - name: Remove ephemeral NATS container
        id: campaign_17
        continue-on-error: true
        if: always() && steps.nats.outputs.run_id != ''
        shell: pwsh
        run: ./scripts/nats-docker.ps1 Cleanup -RunId '${{ steps.nats.outputs.run_id }}'

      - name: Remove ephemeral PostgreSQL and its volume
        id: campaign_18
        continue-on-error: true
        if: always()
        run: docker rm -fv "$POSTGRES_CONTAINER"

      - name: Aggregate every campaign outcome
        if: always()
        env:
          CAMPAIGN_STEPS: ${{ toJson(steps) }}
        run: python scripts/ci_campaign.py campaign_clean campaign_01 campaign_02 campaign_03 campaign_04 nats campaign_06 campaign_07 campaign_08 campaign_09 campaign_10 campaign_11 campaign_12 campaign_13 campaign_14 campaign_15 campaign_17 campaign_18

  fuzz-smoke:
    name: Fuzz smoke suite
    needs: qualification-sha
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # commit dell'action (2026-09-03), non la versione di Rust: quella è in toolchain:
        with:
          toolchain: '1.98.1'

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pinned nightly fuzz toolchain
        run: rustup toolchain install nightly-2026-08-01 --profile minimal

      - name: Install pinned cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2

      - name: Run bounded fuzz smoke suite
        run: |
          for target in message_metadata capability_codec retry_policy nats_config propagation_carrier runtime_inputs; do
            cargo +nightly-2026-08-01 fuzz run "$target" "fuzz/corpus/$target" -- \
              -runs=2000 -timeout=5 -max_len=32768
          done
