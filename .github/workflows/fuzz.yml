name: fuzz

# Campagne con budget di tempo sui sei target di `fuzz/`: un job per target,
# su Linux, partendo dal corpus versionato in `fuzz/corpus/<target>/`. La
# campagna lavora su una copia del corpus, quindi ciò che trova non torna nel
# repository; i reperti restano come artefatto della corsa.
#
# Durata: un minuto a target sulle PR che toccano `fuzz/` o questo workflow,
# dieci minuti ogni domenica e a mano (`seconds` regolabile). Su ogni PR resta
# lo smoke da 2000 esecuzioni del job `Fuzz smoke suite` di ci.yml.
#
# Un crash, un timeout, un superamento del limite di memoria o un'uscita non
# nulla fanno fallire il job.

on:
  pull_request:
    branches: [main]
    paths:
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Domenica 04:37 UTC. Minuto non tondo, come supply-chain.yml.
    - cron: '37 4 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: secondi per target
        required: false
        default: '600'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # La stessa nightly del job `Fuzz smoke suite` e di docs/testing.md:
  # libFuzzer e i sanitizer richiedono una nightly, fissata per data perché
  # la campagna sia ripetibile.
  NIGHTLY: nightly-2026-08-01

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - message_metadata
          - capability_codec
          - retry_policy
          - nats_config
          - propagation_carrier
          - runtime_inputs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup è preinstallato sui runner Ubuntu. Non si usa
      # dtolnay/rust-toolchain: nel repository è pinnata sulla toolchain
      # stabile, e qui serve la nightly datata.
      - name: Rust nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - name: cargo-fuzz 0.13.2
        run: cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - name: campagna
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || github.event.inputs.seconds || '600' }}
        run: |
          work="$RUNNER_TEMP/corpus/$TARGET"
          mkdir -p "$work" "fuzz/artifacts/$TARGET"
          cp fuzz/corpus/"$TARGET"/* "$work/"
          cargo +"$NIGHTLY" fuzz run "$TARGET" "$work" -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -timeout=30 \
            -max_len=32768 -artifact_prefix="fuzz/artifacts/$TARGET/" -print_final_stats=1
      - name: reperti
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
