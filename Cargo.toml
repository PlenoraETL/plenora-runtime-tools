[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "adapters/*",
    "crates/*",
    "examples/*",
    "tests/architecture",
    "tests/integration",
    "tests/memory",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV della famiglia Plenora (ADR 0007); la toolchain fissata è in
# rust-toolchain.toml.
rust-version = "1.98"
# Licenza proprietaria source-available del repository (LICENSE): non esiste
# un identificatore SPDX, quindi si usa `license-file`. Tutti i crate sono
# `publish = false`.
license-file = "LICENSE"

[workspace.dependencies]
# Ogni pin è esatto (`=x.y.z`) e porta la sua motivazione; i crate del
# workspace li ereditano con `workspace = true`. Politica in
# docs/dependency-policy.md.
# Motore worker dell'adapter apalis (ADR 0005): 0.7 stabile, non la 1.0
# candidata; solo concorrenza limitata e cattura dei panic.
apalis = { version = "=0.7.4", default-features = false, features = ["catch-panic", "limit"] }
# Trait asincroni object-safe per i contratti dei crate core
# (handler, sink, broker); nessuna feature.
async-trait = { version = "=0.1.92" }
# Client NATS JetStream dell'adapter nats (ADR 0005): solo JetStream, TLS
# con ring, conversione chrono e credenziali NKey.
async-nats = { version = "=0.50.0", default-features = false, features = ["chrono", "jetstream", "nkeys", "ring"] }
# Server HTTP di plenora-runtime-http e del control plane (ADR 0006): solo
# http1, json, tokio e tracing.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
# Codifica reversibile dei metadati binari Plenora negli header riservati
# NATS (ADR 0005).
base64 = { version = "=0.22.1" }
# Payload dei messaggi senza copie fra broker, worker e codec.
bytes = { version = "=1.12.1" }
# Deadline RFC 3339 UTC, timestamp dei messaggi e dello scheduler; solo la
# feature std (niente clock né locale abilitati qui).
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
# Fusi IANA per lo scheduling cron con DST esplicito; solo std.
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
# Parsing delle espressioni cron dello scheduler; senza feature di default.
cron = { version = "=0.17.0", default-features = false }
# Combinatori di stream per i consumer NATS e per l'adapter apalis; solo
# async-await e std.
futures-util = { version = "=0.3.34", default-features = false, features = ["async-await", "std"] }
# API OpenTelemetry per span e propagazione W3C (ADR 0006); solo trace,
# nessun SDK né exporter.
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
# (De)serializzazione dei documenti di capability, Discovery ed errori
# pubblici; solo derive e std.
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
# Codec JSON dei contratti comuni (Runtime Binding, Discovery,
# plenora-error-v1); stessa versione delle altre librerie Plenora.
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
# Runtime asincrono di tutti i crate; nessuna feature di default, ogni
# crate abilita solo quelle che usa. Stessa versione delle altre librerie
# Plenora.
tokio = { version = "=1.53.1", default-features = false }
# Limiti di concorrenza e servizi componibili per HTTP e apalis; solo
# limit e util.
tower = { version = "=0.5.3", default-features = false, features = ["limit", "util"] }
# Request id, header sensibili e trace del servizio HTTP (ADR 0006).
tower-http = { version = "=0.7.0", default-features = false, features = ["request-id", "sensitive-headers", "trace"] }
# Diagnostica strutturata di HTTP e osservabilità (ADR 0006); nessun
# subscriber globale installato.
tracing = { version = "=0.1.44", default-features = false, features = ["attributes", "std"] }
# Ponte tracing → OpenTelemetry (ADR 0006), versione accoppiata a
# opentelemetry 0.32.
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
# Identificatori di messaggio, correlazione, causazione e outbox (UUID v4).
uuid = { version = "=1.24.1", features = ["v4"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "deny"
unwrap_used = "deny"
