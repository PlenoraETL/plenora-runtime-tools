[package]
name = "plenora-runtime-capabilities"
description = "Bounded capability registry and generic worker dispatcher for Plenora integrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
chrono.workspace = true
plenora-runtime-messaging = { version = "=0.1.0", path = "../plenora-runtime-messaging" }
plenora-runtime-worker = { version = "=0.1.0", path = "../plenora-runtime-worker" }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
plenora-runtime-core = { version = "=0.1.0", path = "../plenora-runtime-core" }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
