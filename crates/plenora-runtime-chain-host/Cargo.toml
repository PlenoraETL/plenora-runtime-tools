[package]
name = "plenora-runtime-chain-host"
description = "Durable chain host with explicit scripted, database and IO candidate profiles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[dependencies]
# Real IO composition stays in the product host; docs/adr/0012-io-chain-adapter.md.
plenora-runtime-adapter-io = { version = "=0.1.0", path = "../plenora-runtime-adapter-io" }
plenora-runtime-adapter-data = { version = "=0.1.0", path = "../plenora-runtime-adapter-data" }
# Real ETL composition stays in the product host; docs/adr/0011-database-chain-adapter.md.
plenora-runtime-adapter-database = { version = "=0.1.0", path = "../plenora-runtime-adapter-database" }
plenora-runtime-chains = { version = "=0.1.0", path = "../plenora-runtime-chains" }
plenora-runtime-chain-store = { version = "=0.1.0", path = "../plenora-runtime-chain-store" }
plenora-runtime-core = { version = "=0.1.0", path = "../plenora-runtime-core" }
# Composition uses the same protected receipt/dispatcher and typed runtime carrier on every surface.
plenora-runtime-boundary = { version = "=0.1.0", path = "../plenora-runtime-boundary" }
plenora-runtime-capabilities = { version = "=0.1.0", path = "../plenora-runtime-capabilities" }
plenora-runtime-messaging = { version = "=0.1.0", path = "../plenora-runtime-messaging" }
plenora-runtime-worker = { version = "=0.1.0", path = "../plenora-runtime-worker" }
uuid.workspace = true
async-trait.workspace = true
# Qualification request/reply on the existing exact NATS client; docs/adr/0010-scripted-chain-facades.md.
async-nats.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# Same exact digest implementation as chain-contracts; verifies immutable fake resource bytes.
sha2 = "=0.10.9"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }

[lints]
workspace = true

[dev-dependencies]
# Real DATA parity fixtures use the same exact Arrow ABI as all three pinned libraries (ADR0013).
arrow-array = "=60.1.0"
arrow-schema = { version = "=60.1.0", features = ["serde"] }
arrow-ipc = "=60.1.0"
# Provider and source data assertions in the real PostgreSQL S3 tests; docs/adr/0011-database-chain-adapter.md.
plenora-database-core = { version = "=11.0.0", git = "https://github.com/PlenoraETL/plenora-database-tools.git", rev = "f4fdb9b5f09d8babe795f68e894949693aa9d0a1" }
plenora-db-postgres = { version = "=11.0.0", git = "https://github.com/PlenoraETL/plenora-database-tools.git", rev = "f4fdb9b5f09d8babe795f68e894949693aa9d0a1" }
# Same exact driver as the operational store, only for real test setup and assertions.
tokio-postgres = "=0.7.18"
plenora-runtime-testkit = { version = "=0.1.0", path = "../plenora-runtime-testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
