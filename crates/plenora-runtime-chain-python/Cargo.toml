[package]
name = "plenora-runtime-chain-python"
description = "Native Python facade for scripted chain qualification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
plenora-runtime-chain-host = { version = "=0.1.0", path = "../plenora-runtime-chain-host" }
plenora-runtime-chains = { version = "=0.1.0", path = "../plenora-runtime-chains" }
# Native CPython binding; detach releases the GIL while the shared Rust runtime executes.
pyo3 = { version = "=0.29.2", features = ["abi3-py310"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
