[package]
name = "plenora-runtime-chain-store"
description = "PostgreSQL durable chain acceptance, execution fences and result outbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[dependencies]
plenora-runtime-capabilities = { path = "../plenora-runtime-capabilities" }
plenora-runtime-messaging = { path = "../plenora-runtime-messaging" }
plenora-runtime-outbox = { path = "../plenora-runtime-outbox" }
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time"] }
uuid.workspace = true
# Operational PostgreSQL driver, independent of ETL. ADR: docs/adr/0009-chain-postgres.md.
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
# Fingerprint of the complete canonical invocation supplied by the boundary.
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

[dev-dependencies]
plenora-runtime-core = { path = "../plenora-runtime-core" }
plenora-runtime-testkit = { path = "../plenora-runtime-testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
