plenora-runtime-outbox = { version = "=0.1.0", path = "../plenora-runtime-outbox" }
plenora-runtime-worker = { version = "=0.1.0", path = "../plenora-runtime-worker" }

[dev-dependencies]
bytes.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

