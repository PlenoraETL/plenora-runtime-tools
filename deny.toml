[graph]
all-features = true

[advisories]
# Riesame: 2027-02-13; owner: manutentori della famiglia Plenora.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, non vulnerabile, nessuna versione sicura; migrazione di famiglia a jiff/time pianificata" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained, non vulnerabile, nessuna versione sicura; segue la migrazione di famiglia da chrono a jiff/time" },
    # Unica eccezione per una vulnerabilita', decisione del titolare del 17/11/2026: scade con
    # l'adozione di IO 10.0.0 pubblicata, che porta zip 9.0.5.
    { id = "RUSTSEC-2026-0548", reason = "zip 9.0.3 solo transitiva via IO fissato da git a 9c087aa7 (=9.0.3); ZipStreamReader non usato da runtime ne' da IO; si toglie adottando IO 10.0.0" },
]
unmaintained = "workspace"
# Una versione ritirata dal registro è un errore, non un avviso.
yanked = "deny"

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
private = { ignore = true }
exceptions = [
    # Locked transitive licenses reviewed in docs/dependency-policy.md; no global allowlist expansion.
    { allow = ["MIT-0"], crate = "borrow-or-share" },
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # `libfuzzer-sys` incorpora libFuzzer di LLVM sotto NCSA, licenza
    # permissiva con obbligo di attribuzione. L'eccezione vale solo per il
    # crate del lock separato di `fuzz/`, invece di ampliare la allowlist.
    { allow = ["MIT", "Apache-2.0", "NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Product pins reviewed in docs/adr/0011-database-chain-adapter.md, docs/adr/0012-io-chain-adapter.md and docs/adr/0013-data-chain-adapter.md.
allow-git = ["https://github.com/PlenoraETL/plenora-database-tools.git", "https://github.com/PlenoraETL/plenora-IO-tools.git", "https://github.com/PlenoraETL/plenora-data-tools.git"]
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://index.crates.io/",
]

