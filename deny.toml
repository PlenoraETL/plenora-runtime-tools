[graph]
all-features = true

[advisories]
unmaintained = "workspace"
# Una versione ritirata dal registro è un errore, non un avviso.
yanked = "deny"

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
private = { ignore = true }
exceptions = [
    # Locked transitive licenses reviewed in docs/dependency-policy.md; no global allowlist expansion.
    { allow = ["MIT-0"], crate = "borrow-or-share" },
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # `libfuzzer-sys` incorpora libFuzzer di LLVM sotto NCSA, licenza
    # permissiva con obbligo di attribuzione. L'eccezione vale solo per il
    # crate del lock separato di `fuzz/`, invece di ampliare la allowlist.
    { allow = ["MIT", "Apache-2.0", "NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Product pins reviewed in docs/adr/0011-database-chain-adapter.md and docs/adr/0012-io-chain-adapter.md.
allow-git = ["https://github.com/PlenoraETL/plenora-database-tools.git", "https://github.com/PlenoraETL/plenora-IO-tools.git"]
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://index.crates.io/",
]

