[package]
name = "plenora-runtime-example-benchmark"
description = "Reproducible bounded worker and scheduler microbenchmark."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
plenora-runtime-core = { path = "../../crates/plenora-runtime-core", version = "=0.1.0" }
plenora-runtime-messaging = { path = "../../crates/plenora-runtime-messaging", version = "=0.1.0" }
plenora-runtime-scheduler = { path = "../../crates/plenora-runtime-scheduler", version = "=0.1.0" }
plenora-runtime-worker = { path = "../../crates/plenora-runtime-worker", version = "=0.1.0" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
