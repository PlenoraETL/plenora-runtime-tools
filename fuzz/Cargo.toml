[package]
name = "plenora-runtime-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# Workspace separato con lock proprio: isola la nightly e libFuzzer dal
# workspace principale. Le versioni esterne coincidono con i pin del
# workspace, così il fuzz esercita lo stesso codice della libreria.
# Valori dei metadati e payload dei messaggi costruiti dai target; stesso
# pin del workspace.
bytes = "=1.12.1"
# Harness libFuzzer usato da cargo-fuzz 0.13.2; licenza NCSA ammessa solo per
# questo crate in deny.toml.
libfuzzer-sys = "=0.4.13"
# Trait Injector/Extractor della propagazione W3C per il target
# propagation_carrier; stesso pin e stesse feature del workspace.
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
# Crate del workspace sotto fuzz, per percorso e versione esatta.
plenora-runtime-capabilities = { version = "=0.1.0", path = "../crates/plenora-runtime-capabilities" }
plenora-runtime-control = { version = "=0.1.0", path = "../crates/plenora-runtime-control" }
plenora-runtime-messaging = { version = "=0.1.0", path = "../crates/plenora-runtime-messaging" }
plenora-runtime-nats = { version = "=0.1.0", path = "../adapters/plenora-runtime-nats" }
plenora-runtime-observability = { version = "=0.1.0", path = "../crates/plenora-runtime-observability" }
plenora-runtime-scheduler = { version = "=0.1.0", path = "../crates/plenora-runtime-scheduler" }
plenora-runtime-subprocess = { version = "=0.1.0", path = "../crates/plenora-runtime-subprocess" }

[workspace]
members = ["."]
resolver = "3"

[[bin]]
name = "message_metadata"
path = "fuzz_targets/message_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capability_codec"
path = "fuzz_targets/capability_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "retry_policy"
path = "fuzz_targets/retry_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nats_config"
path = "fuzz_targets/nats_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "propagation_carrier"
path = "fuzz_targets/propagation_carrier.rs"
test = false
doc = false
bench = false

[[bin]]
name = "runtime_inputs"
path = "fuzz_targets/runtime_inputs.rs"
test = false
doc = false
bench = false
