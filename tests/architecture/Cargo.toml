[package]
name = "plenora-runtime-architecture-tests"
description = "Static architecture and production-source policy tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Parse every Rust production API structurally; already resolved by workspace macros.
syn = { version = "=2.0.119", features = ["full", "visit"] }
# Stable token rendering for reviewed API signatures, not substring name matching.
quote = "=1.0.47"

[lints]
workspace = true
