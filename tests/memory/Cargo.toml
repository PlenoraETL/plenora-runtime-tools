[package]
name = "plenora-runtime-memory-tests"
description = "Bounded memory-retention probe for the Plenora worker runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[[bin]]
name = "plenora-memory-probe"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
plenora-runtime-core = { version = "=0.1.0", path = "../../crates/plenora-runtime-core" }
plenora-runtime-messaging = { version = "=0.1.0", path = "../../crates/plenora-runtime-messaging" }
plenora-runtime-worker = { version = "=0.1.0", path = "../../crates/plenora-runtime-worker" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
